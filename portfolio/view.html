<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Student Project &mdash; Practical English 3</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-en, 'Georgia', serif);
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
    }

    .topbar {
      flex-shrink: 0;
      height: 52px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 0.8rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 100;
    }

    .topbar a {
      color: white;
      text-decoration: none;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .back-btn {
      background: rgba(0,0,0,0.25);
    }
    .back-btn:hover { background: rgba(0,0,0,0.45); transform: translateX(-2px); }

    .new-tab-btn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .new-tab-btn:hover { background: rgba(255,255,255,0.3); }

    .project-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 0.5rem;
    }
    .project-info .title {
      font-weight: 600;
      font-size: 1rem;
    }
    .project-info .student {
      font-family: var(--font-ko, 'Noto Sans KR', sans-serif);
      opacity: 0.85;
      font-size: 0.85rem;
      margin-left: 0.6rem;
    }
    .project-info .week {
      display: inline-block;
      font-size: 0.7rem;
      background: rgba(0,0,0,0.25);
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 0.5rem;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: white;
    }

    /* 호환성 안내 (iframe 로드 실패 시) */
    .fallback-notice {
      display: none;
      padding: 2rem;
      text-align: center;
      color: white;
      background: #2a2a3e;
    }
    .fallback-notice.visible { display: block; }
    .fallback-notice a { color: #ffd93d; text-decoration: underline; }

    @media (max-width: 600px) {
      .topbar { padding: 0 0.6rem; gap: 0.4rem; }
      .project-info .title { font-size: 0.9rem; }
      .project-info .student { font-size: 0.78rem; margin-left: 0.4rem; }
      .topbar a { padding: 0.3rem 0.6rem; font-size: 0.78rem; }
      .back-btn .label-full { display: none; }
      .new-tab-btn .label-full { display: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="back-btn" title="포트폴리오로 돌아가기">
      &larr; <span class="label-full">Back to Portfolio</span>
    </a>
    <div class="project-info">
      <span class="week" id="proj-week">&nbsp;</span>
      <span class="title" id="proj-title">Loading&hellip;</span>
      <span class="student" id="proj-student"></span>
    </div>
    <a href="#" class="new-tab-btn" id="open-new" target="_blank" rel="noopener" title="새 탭에서 열기 (iframe에서 작동하지 않는 경우)">
      <span class="label-full">새 탭으로 &nbsp;</span>&#x2197;
    </a>
  </div>

  <iframe id="proj-frame" src="about:blank" title="Student project content" allow="fullscreen"></iframe>

  <div class="fallback-notice" id="fallback">
    <h3>프로젝트를 불러올 수 없습니다</h3>
    <p>URL 파라미터가 누락되었거나 잘못되었습니다.</p>
    <p><a href="index.html">&larr; 포트폴리오로 돌아가기</a></p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const projectFile = params.get('p');      // 예: week04-kim-seafood-master.html
      const title       = params.get('t');      // 예: Seafood Master
      const student     = params.get('s');      // 예: 김OO
      const week        = params.get('w');      // 예: Week 4 (선택)

      if (!projectFile) {
        document.querySelector('iframe').style.display = 'none';
        document.getElementById('fallback').classList.add('visible');
        return;
      }

      const projectUrl = 'projects/' + projectFile;
      const titleText = title || 'Student Project';
      const studentText = student || '';

      // 상단 바 채우기
      document.getElementById('proj-title').textContent = titleText;
      document.getElementById('proj-student').textContent = studentText ? '· ' + studentText : '';
      document.getElementById('proj-week').textContent = week || '';
      if (!week) document.getElementById('proj-week').style.display = 'none';

      // iframe 로드 및 새 탭 링크 설정
      document.getElementById('proj-frame').src = projectUrl;
      document.getElementById('open-new').href = projectUrl;

      // 페이지 타이틀
      document.title = titleText + (studentText ? ' · ' + studentText : '') + ' — Student Portfolio';
    })();
  </script>
</body>
</html>
